services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      PORT: "8080"
      DATABASE_URL: "/data/me-lab.db"
      JWT_SECRET: "${JWT_SECRET:-dev-compose-jwt-secret-change-in-production-32b}"
      JWT_EXPIRY_HOURS: "${JWT_EXPIRY_HOURS:-24}"
      LOG_LEVEL: "${LOG_LEVEL:-info}"
      CORS_ALLOWED_ORIGINS: "${CORS_ALLOWED_ORIGINS:-http://localhost:8081,http://localhost:5173}"
    volumes:
      - melab_sqlite_data:/data
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/ready"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "8081:8081"

volumes:
  melab_sqlite_data:
    driver: local
