name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    name: Go Format, Vet & Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Check gofmt
        run: |
          unformatted=$(gofmt -l cmd internal migrations)
          if [ -n "$unformatted" ]; then
            echo "Unformatted Go files:"
            echo "$unformatted"
            exit 1
          fi

      - name: Run go vet
        run: go vet ./cmd/... ./internal/... ./migrations/...

      - name: Run Go unit and integration tests with race detector
        run: go test -race -coverprofile=coverage.out -covermode=atomic ./cmd/... ./internal/... ./migrations/...

      - name: Verify pure-Go static binary compilation (CGO_ENABLED=0)
        env:
          CGO_ENABLED: "0"
        run: go build -trimpath ./cmd/api ./cmd/migrate

  frontend:
    name: Frontend Lint, Typecheck, Tests & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript type-check
        run: npm run type-check

      - name: Run Vitest unit tests
        run: npm run test

      - name: Build production bundle
        run: npm run build

  docker:
    name: Docker Compose Image Build
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Build API and Web containers
        run: docker compose -f compose.yaml build
