name: Deploy to Azure

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  id-token: write # Required for Azure OIDC federated authentication
  contents: read
  packages: write

jobs:
  deploy:
    name: Build, Push & Deploy to Azure VM
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/api:${{ github.sha }}
            ghcr.io/${{ github.repository }}/api:latest

      - name: Build and push Web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./web/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/web:${{ github.sha }}
            ghcr.io/${{ github.repository }}/web:latest

      - name: Azure Login via OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy infrastructure and application through ARM/Bicep
        uses: azure/arm-deploy@v2
        with:
          resourceGroupName: ${{ vars.AZURE_RESOURCE_GROUP }}
          template: deployments/azure/main.bicep
          deploymentName: me-lab-${{ github.run_id }}
          deploymentMode: Incremental
          parameters: >
            environmentName=prod
            location=${{ vars.AZURE_LOCATION }}
            vmSize=${{ vars.AZURE_VM_SIZE }}
            adminUsername=${{ vars.AZURE_ADMIN_USERNAME }}
            sshPublicKey="${{ secrets.AZURE_SSH_PUBLIC_KEY }}"
            sshAllowedCidr=${{ vars.AZURE_SSH_ALLOWED_CIDR }}
            dnsLabelPrefix=${{ vars.AZURE_DNS_LABEL_PREFIX }}
            appImageTag=${{ github.sha }}
            githubRepository=${{ github.repository }}
            ghcrUsername=${{ github.actor }}
            ghcrPullToken="${{ secrets.GHCR_PULL_TOKEN }}"
            jwtSecret="${{ secrets.AZURE_JWT_SECRET }}"
            corsAllowedOrigins=${{ vars.PUBLIC_BASE_URL }}

      - name: Post-deployment HTTPS health & readiness check
        run: |
          for attempt in $(seq 1 12); do
            if curl -fsS "${{ vars.PUBLIC_BASE_URL }}/ready" | jq -e '.status == "ok"'; then
              echo "Deployment verified healthy at ${{ vars.PUBLIC_BASE_URL }}"
              exit 0
            fi
            sleep 5
          done
          echo "Post-deployment readiness check failed"
          exit 1
