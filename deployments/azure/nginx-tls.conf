# ME Lab — Host Nginx TLS Reverse Proxy Configuration
# Install to: /etc/nginx/sites-available/me-lab.conf
# Replace `melab.example.com` with your Azure Public IP FQDN or custom domain.

limit_req_zone $binary_remote_addr zone=melab_auth_limit:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=melab_api_limit:10m rate=120r/m;

server {
    listen 80;
    listen [::]:80;
    server_name melab.example.com;

    # Allow Let's Encrypt HTTP-01 ACME challenges without redirect
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name melab.example.com;

    # Let's Encrypt TLS certificates managed by Certbot
    ssl_certificate     /etc/letsencrypt/live/melab.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/melab.example.com/privkey.pem;

    # Modern TLS 1.2 / 1.3 hardening
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:MELabTLS:10m;
    ssl_session_tickets off;

    client_max_body_size 2m;

    # Security headers
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Strict rate-limiting on authentication endpoints
    location /api/v1/auth/ {
        limit_req zone=melab_auth_limit burst=10 nodelay;
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Request-ID $request_id;
    }

    # Go REST API, OpenAPI spec, Swagger UI, and health/readiness probes
    location ~ ^/(api/|docs|openapi\.json|health|ready) {
        limit_req zone=melab_api_limit burst=60 nodelay;
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Request-ID $request_id;
        proxy_read_timeout 60s;
    }

    # Static React 18 + Three.js (R3F) SPA container
    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
